  <text x="400" y="65" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#64748b">Taxa d'èxit de cada agent enfrontat al Defensor Equilibrat (Balanced)</text>
  
