# Global simulation configuration parameters
simulation:
  name: "ai_cyber_defense_sim"
  version: "0.1.0"
  max_ticks: 100
  random_seed: 42
  turn_based: true

logging:
  level: "INFO"
  log_to_file: true
  log_file_path: "data/logs/simulation.jsonl"
  format: "json"

telemetry:
  metrics_output_path: "data/results/run_metrics.csv"
  track_mttd: true
  track_node_compromise_rate: true
  track_false_positive_rate: true
