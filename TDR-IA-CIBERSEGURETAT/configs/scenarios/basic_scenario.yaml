# Scenario definition: objectives, initial conditions, and evaluation criteria
scenario_id: "data_exfiltration_01"
title: "Simulated Data Exfiltration from Secure Database"
description: "Attacker attempts to compromise the DMZ, pivot to the internal network, and exfiltrate data from the database server."

initial_state:
  attacker_initial_access: "external"
  defender_detection_threshold: 0.75
  attacker_starting_knowledge:
    discovered_nodes: ["192.168.1.10"]

objectives:
  attacker:
    target_node: "db_server_01"
    target_action: "exfiltrate_data"
    max_turns: 50
  defender:
    protect_node: "db_server_01"
    identify_malicious_ip: true
    isolate_compromised_nodes: true

reward_structure:
  attacker:
    recon_reward: 1
    exploit_reward: 10
    objective_achieved_reward: 100
    detected_penalty: -20
  defender:
    detection_reward: 30
    containment_reward: 50
    false_positive_penalty: -15
    service_disruption_penalty: -10
